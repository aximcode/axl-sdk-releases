# axl-toolchains.conf -- the single source of truth for where AXL's
# bare-metal C++ cross toolchains live.
#
# WHY THIS FILE EXISTS. The AArch64 toolchain path was spelled out in five
# places -- the Makefile, scripts/axl-cc, two spots in scripts/install.sh
# (one of them inside the GENERATED axl-config.cmake), and
# scripts/install-toolchain.sh. Adding the x64 toolchain would have made ten.
# That is the same three-build-path drift `make check-flag-parity` exists to
# catch for compile flags, and the toolchain path had no equivalent guard.
#
# FORMAT IS LOAD-BEARING: plain KEY=VALUE, no spaces around `=`, no shell or
# make interpolation, one absolute path per line. That subset is simultaneously
# valid `sh` (so scripts can `source` it) and valid `make` (so the Makefile can
# `include` it). Interpolation is what would break that -- `$(...)` is make,
# `${...}` is shell, and neither reads the other -- so paths are spelled in
# full even though it repeats the version string. `make check-toolchain-conf`
# asserts the repetition stays consistent.
#
# OVERRIDING: every `*_GXX_DEFAULT` below has a matching override variable
# without the suffix. Consumers resolve `${AXL_AA64_GXX:-$AXL_AA64_GXX_DEFAULT}`
# (make: `AXL_AA64_GXX ?= $(AXL_AA64_GXX_DEFAULT)`), so an environment variable
# always wins and this file never clobbers one. Set them to build against a
# toolchain installed somewhere other than /opt -- a per-user prefix, a CI
# cache, or a locally built tree such as toolchain/x86_64-elf/out/.

# --- AArch64: ARM's bare-metal GNU toolchain -------------------------------
# Fetched from developer.arm.com by scripts/install-toolchain.sh aa64.
# Pinned so axl-sdk-built C++ and consumer-built C++ share an ABI.
AXL_AA64_TOOLCHAIN_VERSION=14.3.rel1
AXL_AA64_TOOLCHAIN_DIR=/opt/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-elf
AXL_AA64_GXX_DEFAULT=/opt/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-g++
# The C compiler from the SAME toolchain. C moved here from
# aarch64-linux-gnu-gcc when include/compat was retired: that cross targets
# glibc, so its headers are the host libc's, and the migration's goal is a
# build that uses no host headers or libraries at all.
AXL_AA64_GCC_DEFAULT=/opt/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-gcc
# The BINUTILS prefix -- ld, ar, objcopy. Previously the build used apt's
# aarch64-linux-gnu-* for these, on the grounds that binutils consume objects
# rather than headers. True, and superseded by the hermetic direction
# (AXL-Libc-Substrate-Design.md §4.1d): safe is not the same as ours. ARM's
# toolchain ships pei-aarch64-little, which is the target the .so -> .efi
# conversion needs, so aa64 could move; x64 could not (see §4.1d).
AXL_AA64_BINUTILS_PREFIX_DEFAULT=/opt/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
# Sits WITH its version: bumping the version changes the download URL, and a
# checksum left behind elsewhere turns that into a sha mismatch naming neither
# cause. check-toolchain-conf requires this key to be present and 64 hex chars.
AXL_AA64_TOOLCHAIN_SHA256=ebaf2d47f2e7f7b645864c5c8cf839e526daed83a2e675a3525d03f5ba3d2be9

# --- x86_64: AXL's own bare-metal toolchain --------------------------------
# No upstream publishes an x86_64-elf bare-metal GCC (bootlin ships only
# linux-gnu/musl; crosstool-NG is not packaged; no distro carries one), so AXL
# builds it: toolchain/x86_64-elf/build-toolchain.sh, ~40 min on 8 cores.
# The -axlN suffix marks AximCode's BUILD of those upstream versions, not a new
# upstream release -- the distinction ARM draws with 14.3.rel1. Rebuild with:
#   PREFIX=/opt/x86_64-elf-gcc-14.3.0-axl2 PACKAGE=1 \
#       toolchain/x86_64-elf/build-toolchain.sh
# The host g++ CANNOT substitute: it is glibc-targeted, so its libsupc++ reads
# the exception globals through %fs (18 such accesses across 11 objects), which
# UEFI never sets up -- the first throw faults before reaching the unwinder.
#
# -axl2 adds --enable-initfini-array. WITHOUT it, GCC's x86_64-*-elf default
# puts global constructors in .ctors, AXL's crt0 walks only .init_array
# (src/runtime/axl-cxxabi.c), and NOTHING runs -- not the consumer's
# constructors and not the 26 objects' worth inside the toolchain's own
# libstdc++.a. Silently: no diagnostic anywhere. aa64 never showed it because
# the aarch64 port forces .init_array at the target level. The revision is what
# distinguishes the two trees, since the configure flags are not recorded
# anywhere a consumer can compare.
AXL_X64_TOOLCHAIN_VERSION=14.3.0-axl2
AXL_X64_TOOLCHAIN_DIR=/opt/x86_64-elf-gcc-14.3.0-axl2
# Prebuilt tarball, so the 40-minute build is a 55 MB download for everyone
# except whoever cuts a new toolchain version. Published on the RELEASES repo
# next to the SDK packages; if it moves to its own repo later, this URL is the
# one line that changes. Built by toolchain/x86_64-elf/build-toolchain.sh with
# PACKAGE=1, stripped (1.5 GB -> 235 MB installed) exactly as ARM ships theirs.
AXL_X64_TOOLCHAIN_URL=https://github.com/aximcode/axl-sdk-releases/releases/download/toolchain-x86_64-elf-14.3.0-axl2/x86_64-elf-gcc-14.3.0-axl2.tar.xz
# Same rule as the aa64 checksum: it lives WITH its version, so a bump cannot
# leave a stale sha behind and fail at `sha256sum -c` naming neither cause.
AXL_X64_TOOLCHAIN_SHA256=20ee077252bfd3205bcf6c2f0aa119c84c17484d6610bc8ca516a9fe42db1501
AXL_X64_GXX_DEFAULT=/opt/x86_64-elf-gcc-14.3.0-axl2/bin/x86_64-elf-g++
# C, same toolchain, same reason as aa64 above: host gcc would resolve
# <string.h> and friends to /usr/include (glibc), which is exactly the
# non-hermetic build include/compat existed to prevent.
AXL_X64_GCC_DEFAULT=/opt/x86_64-elf-gcc-14.3.0-axl2/bin/x86_64-elf-gcc
# ld, ar, objcopy -- ours now, like aa64's. This is what the -axl rebuild was
# FOR: a --target=x86_64-elf binutils carries no PE target, so
# `objcopy --output-target=pei-x86-64` (the .so -> .efi step) could not run and
# the build had to borrow the host's. -axl adds --enable-targets=x86_64-pep.
AXL_X64_BINUTILS_PREFIX_DEFAULT=/opt/x86_64-elf-gcc-14.3.0-axl2/bin/x86_64-elf-
