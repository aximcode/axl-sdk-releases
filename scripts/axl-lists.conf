# axl-lists.conf -- the build's NAMED LISTS, defined once for every reader.
#
# The shipped tool set, the host-side scripts that ship, and the like used to
# live in the Makefile, and everything else asked for them with
# `make -s print-<NAME>` -- packaging, gates, tests. The CMake build restated
# the tool lists in tools/CMakeLists.txt, a second copy. They live here now,
# read by:
#   - scripts/axl-list.sh NAME...   (scripts, gates, tests: one line per NAME,
#                                    its words space-separated -- the shape
#                                    `make -s print-NAME` printed)
#   - tools/CMakeLists.txt          (through axl-list.sh, at configure time)
#   (the Makefile `include`d it too, until 5.0.0 retired the Makefile)
#
# FORMAT, deliberately a make-like subset: `NAME = words`,
# a trailing backslash continues the line, `#` starts a comment line, and a
# word may be `$(OTHER)` -- a list defined ABOVE it, expanded in place. No
# other make syntax: axl-list.sh refuses anything it does not understand
# rather than guessing.

# The standalone UEFI utilities built through AXL_TOOL_MAIN, in the order the
# multi-call image (axl.efi) lists its applets.
TOOL_NAMES = hexdump fetch find grep sed cat sysinfo netinfo mkrd rfbrowse \
    ipmi dmidecode memspd lspci lsusb mkfixture rndisfix timetest i2c clip \
    paste tar nvme ata scsi smart fwtool axbench kbtune netload lsproto cut \
    tr lsacpi md5sum sha256sum

# Applications built from tools/ that are NOT in TOOL_NAMES: each has a custom
# entry point (an embedded driver, a deliberate fault, a subcommand tree) so it
# calls axl_version_handle() directly instead of going through AXL_TOOL_MAIN.
# Named here so check-tool-version can see them -- walking TOOL_NAMES alone
# left three shipped applications unchecked, and the gate reported clean over
# a tools/fbcon.c with no AXL_TOOL_MAIN in it at all.
TOOL_EXTRA_APPS = fbcon crashtest 9p sshd agent

# The shipped set: every image the release stages from tools/. Each links to
# tools/raw/<n>.efi and ships as tools/<n>.efi through the pack wrap -- the
# axl-pack stub when the wrap pays, else a byte copy -- in DEBUG and RELEASE
# alike, so every integration test that boots a tool boots what ships.
# crashhandler is not in it (drivers/, not staged by the release).
SHIPPED_TOOL_NAMES = $(TOOL_NAMES) $(TOOL_EXTRA_APPS) kbtune-drv SftpServer \
    sshd-full

# The host-side scripts that ship to consumers, in BOTH layouts: install.sh
# stages them to <prefix>/libexec/axl, and the host-tools tarball packs the
# same set. They were two hand-written lists until adding axl_version.py to
# one and not the other shipped a tarball whose four Python tools all died
# with ModuleNotFoundError.
#
# The line between this and SDK-internal tooling: runtime and debug aids a
# consumer needs to test a .efi. Header generation, packaging, version-bump and
# the docs build stay behind. Linker scripts and pe-set-debug.c are BUILD
# inputs and deliberately absent.
HOST_TOOL_FILES = run-qemu.sh axl-common.sh axl-emulate rsod-decode.py \
    gdb-syms.py gdb-sample.py profile-qemu.sh extract-fv-shell.py \
    axl-prune.sh axl_version.py

# Goals that leave no artifact a later call could reuse -- a REPORT, which the
# caller reads from the build's output. The integration runner never records
# them as pre-built (test/integration/lib/suite-prep.sh), or a test's own
# call would be skipped and print nothing. Each must name a target of the
# CMake build (cmake/AxlGoals.cmake refuses to configure otherwise).
NON_ARTIFACT_GOALS = tool-sizes
