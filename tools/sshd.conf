# sshd.conf -- settings for sshd.efi, read from beside sshd.efi at start.
#
# OpenSSH sshd_config(5) syntax: "Keyword value", one per line; keywords are
# case-insensitive; "#" starts a comment. Every keyword this sshd supports is
# listed below, commented out, at its default value -- except AxlPassword,
# which has no default: remove the "#" and change the value to override it.
# Command-line flags win over this file.
# `sshd -T` prints the settings in effect; `sshd -T -f FILE` checks a file.
# A keyword OpenSSH has but this sshd does not is refused by name, so a
# setting written here either works or stops sshd from starting.

# TCP port to listen on (-p).
#Port 22

# Seconds a connection has to authenticate before it is dropped.
#LoginGraceTime 60

# Authentication attempts allowed per connection.
#MaxAuthTries 3

# Shell sessions open at once.
#MaxSessions 10

# Seconds of client silence before sshd probes it (0 = never).
#ClientAliveInterval 60

# Unanswered probes before the client is dropped.
#ClientAliveCountMax 3

# Seconds a connection may go without a session before it is closed
# (none = never).
#UnusedConnectionTimeout 300

# Allow logins with a key from AuthorizedKeysFile.
#PubkeyAuthentication yes

# Allow password logins. They need a password: set AxlPassword below (or
# start sshd with -P PASSWORD); with none set, password logins are refused.
#PasswordAuthentication yes

# File whose text is shown to a client before it authenticates.
#Banner none

# IPv4 addresses or CIDR ranges, comma-separated, never penalised (-x).
#PerSourcePenaltyExemptList none

# How much sshd logs: QUIET, FATAL, ERROR, INFO, VERBOSE, DEBUG, DEBUG1-3 (-v).
#LogLevel INFO

# Public keys allowed to log in, one per line; relative to sshd.efi (-k).
#AuthorizedKeysFile authorized_keys

# Host key: an unencrypted private key as `ssh-keygen -t ed25519 -N ""` writes
# it, relative to sshd.efi (--host-key). Repeatable; the first that loads is
# used. Without one, sshd keeps its key in a UEFI variable on this machine
# (AxlSshHostKeyEd25519), made at the first start; `sshd hostkey --import FILE`
# moves a key file there, so the private key need not stay on this medium.
#HostKey ssh_host_ed25519_key

# Unauthenticated connections allowed at once.
#MaxStartups 10

# Bytes after which the session keys are renewed (a time limit is refused).
#RekeyLimit default none

# Penalty seconds a source earns for a failed login (authfail), a connection
# that never logged in (noauth) or one that ran out LoginGraceTime
# (grace-exceeded); a source is refused once past min, for at most max.
# "no" turns penalties off.
#PerSourcePenalties authfail:5 noauth:1 grace-exceeded:10 max:600 min:15

# File transfer: sftp(1), and scp(1) since OpenSSH 9.0. SftpServer.efi,
# beside sshd.efi, is loaded as sshd starts and unloaded as it stops, so a
# new copy takes effect at the next start (sshd-full.efi carries its own).
# Comment the line out to turn SFTP off, as in OpenSSH; AxlSftpReadOnly
# below keeps it on but refuses writes.
Subsystem sftp SftpServer.efi

# The NIC to bring up: auto (the first usable) or its ordinal (-n).
#AxlNic auto

# Seconds the network bring-up may take before sshd gives up (--net-timeout).
#AxlNetworkTimeout 60

# The password for password logins (-P), in plain text: anyone who can read
# this file can log in. Unset by default; sshd refuses the placeholder below,
# so replace it with the password:
#AxlPassword your-password-here

# Serve sessions that watch the console but cannot type (-R). They cannot
# change files over SFTP either.
#AxlReadOnly no

# Refuse every SFTP write -- put, rm, mkdir, rmdir, rename, a size or time
# change -- with "Permission denied", while reads still work
# (--sftp-read-only).
#AxlSftpReadOnly no

# Write each console reshape (a `mode`) to the first serial port, for a test
# harness's terminal (--report-geometry).
#AxlReportGeometry no

# The serial port sshd's log goes to while it serves (--log-port): auto (the
# first port the console does not draw on; if it draws on every one, no
# port gets it -- `sshd log` still prints it), none, or a port number, 0 for
# the first. A number is used
# even when the console draws on that port -- and then the log's lines
# scroll the serial console under the Shell, which paints its typed line and
# output on the wrong rows.
#AxlLogPort auto
# Microseconds a connection keeps being polled after each reply, so the
# client's next request is answered at once rather than at the firmware's
# next 10 ms timer tick (--tcp-linger, 0-20000; 0 = off). Off by default:
# measure on your platform first. On QEMU's virtio-net, 9000 took an
# `sftp -R 1` download from 1.5 to 16.3 MB/s; on QEMU's e1000 it made
# uploads slower (a QEMU receive-ring defect).
#AxlTcpLinger 0
