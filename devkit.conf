# axl-sdk devkit manifest
#
# Declares the shell tools that axl-sdk contributes to the uefi-devkit
# image. Read by uefi-devkit's orchestrator for artifact staging and
# startup.nsh tool-list / alias generation.
#
# axl-sdk's build is special-cased in uefi-devkit, which drives it directly,
# so this file has no `build:`
# field. Since 5.0.0 (the Makefile retired) that build is
# `$AXL_DIR/scripts/axl-build.sh ARCH=<arch> tools`, and sshd-rtk's is
# `scripts/axl-build.sh ARCH=<arch> sshd-rtk sshd-full-rtk RTK_USB_UNDI=<drv>`,
# which builds into its own tree (build/<arch>-debug-rtk/) -- the paths below.
# (`make -C $AXL_DIR tools AXL_TLS=1` no longer exists; nor does AXL_TLS.)
# The orchestrator drives the build directly. This manifest
# only declares what axl-sdk *produces* and how it should be named on
# the image.

# Tool descriptions (used by startup.nsh "Available tools" listing +
# %arch%\<name>.efi alias generation)
desc: SysInfo        System inventory (CPU, memory, firmware)
desc: NetInfo        Network diagnostics and ping
desc: Grep           Text pattern search in files
desc: Find           File and directory finder
desc: Hexdump        Hex/ASCII file viewer
desc: Cat            Concatenate and display files
desc: Tar            Create/list/extract ustar archives (gzip)
desc: Fetch          HTTP GET/POST client
desc: Clip           Copy stdin to the clipboard (pbcopy)
desc: Paste          Print the clipboard to stdout (pbpaste)
desc: MkRd           Create/list/destroy RAM disks
desc: Ipmi           AXL port of the ipmitool CLI
desc: RfBrowse       Redfish browser
desc: Dmidecode      SMBIOS / DMI table decoder
desc: LsPci          PCI/PCIe device lister
desc: LsUsb          USB device lister
desc: LsAcpi         ACPI table browser + firmware/PCI correlation
desc: LsProto        List UEFI protocols present in the system by canonical spec name
desc: MemSpd         Read JEDEC SPD from DDR4/DDR5 DIMMs over SMBus
desc: I2c            I2C/SMBus explorer (detect/get/set/dump)
desc: MkFixture      Capture hardware fixture for replay/emulation
desc: RndisFix       Send RNDIS_SET_MSG packet filter to RNDIS USB-NICs (workaround for EDK2 UsbRndis stub)
desc: TimeTest       Verify the monotonic microsecond timer
desc: Sed            Stream editor — POSIX sed(1) plus common GNU extensions
desc: Cut            Remove sections from each line — POSIX cut(1)
desc: Tr             Translate, squeeze, and delete bytes — POSIX tr(1)
desc: Md5Sum         Print or check MD5 checksums — GNU md5sum(1)
desc: Sha256Sum      Print or check SHA-256 checksums — GNU sha256sum(1)
desc: FwTool         UEFI firmware image inspector (list/extract/find over .fd)
desc: Ata            List ATA/SATA devices with identity + SMART health
desc: Nvme           List NVMe controllers + namespaces with identity + SMART
desc: Scsi           List SCSI/SAS LUs with identity, capacity, health
desc: Smart          Unified storage inventory + health (smartctl --scan -H)
desc: Axbench        AP-pool (AxlTaskPool) vs BSP benchmark across 8 scenarios
desc: KbTune         Keyboard debounce tuner for KVM key-bounce (GOP UI)
desc: FbCon          Framebuffer console take-over — renders the boot Shell on the GOP (Ctrl+\ exits)
desc: NetLoad        Load a NIC driver, check link, try DHCP (crash-culprit breadcrumb)
desc: Agent          Run Shell command lines sent over HTTP (status + output as JSON)
desc: 9p             9P2000.L client and server (ls/get/put, serve, mount)
desc: Sshd           Serve the live UEFI Shell over SSH (resident; stop/status)
desc: SshdRtk        Sshd with the Realtek USB NIC driver built in (no drivers folder needed)
desc: SftpServer     Sshd's SFTP helper: loaded by Sshd for sftp/scp, not run by hand
desc: SshdFull       Sshd with the SFTP helper built in: Shell, sftp and scp in one file
desc: SshdFullRtk    SshdFull with the Realtek USB NIC driver built in as well
desc: CrashHandler   DXE driver — captures CPU exceptions to NVRAM
desc: CrashTest      Deliberately trigger exceptions to test CrashHandler

# Artifact paths. axl-sdk writes to build/<arch>-debug/tools/ (the CMake
# tree `scripts/axl-build.sh --print-prefix ARCH=<arch>` names).
# ${arch} expands to x64 / aa64 per ARCH.
binary  build/${arch}-debug/tools/sysinfo.efi    ${arch}/SysInfo.efi
binary  build/${arch}-debug/tools/netinfo.efi    ${arch}/NetInfo.efi
binary  build/${arch}-debug/tools/grep.efi       ${arch}/Grep.efi
binary  build/${arch}-debug/tools/find.efi       ${arch}/Find.efi
binary  build/${arch}-debug/tools/hexdump.efi    ${arch}/Hexdump.efi
binary  build/${arch}-debug/tools/cat.efi        ${arch}/Cat.efi
binary  build/${arch}-debug/tools/tar.efi        ${arch}/Tar.efi
binary  build/${arch}-debug/tools/fetch.efi      ${arch}/Fetch.efi
binary  build/${arch}-debug/tools/clip.efi       ${arch}/Clip.efi
binary  build/${arch}-debug/tools/paste.efi      ${arch}/Paste.efi
binary  build/${arch}-debug/tools/mkrd.efi       ${arch}/MkRd.efi
binary  build/${arch}-debug/tools/ipmi.efi       ${arch}/Ipmi.efi
binary  build/${arch}-debug/tools/rfbrowse.efi   ${arch}/RfBrowse.efi
binary  build/${arch}-debug/tools/dmidecode.efi  ${arch}/Dmidecode.efi
binary  build/${arch}-debug/tools/lspci.efi      ${arch}/LsPci.efi
binary  build/${arch}-debug/tools/lsusb.efi      ${arch}/LsUsb.efi
binary  build/${arch}-debug/tools/lsacpi.efi     ${arch}/LsAcpi.efi
binary  build/${arch}-debug/tools/lsproto.efi    ${arch}/LsProto.efi
binary  build/${arch}-debug/tools/memspd.efi     ${arch}/MemSpd.efi
binary  build/${arch}-debug/tools/i2c.efi        ${arch}/I2c.efi
binary  build/${arch}-debug/tools/mkfixture.efi  ${arch}/MkFixture.efi
binary  build/${arch}-debug/tools/rndisfix.efi   ${arch}/RndisFix.efi
binary  build/${arch}-debug/tools/timetest.efi   ${arch}/TimeTest.efi
binary  build/${arch}-debug/tools/sed.efi        ${arch}/Sed.efi
binary  build/${arch}-debug/tools/cut.efi        ${arch}/Cut.efi
binary  build/${arch}-debug/tools/tr.efi         ${arch}/Tr.efi
binary  build/${arch}-debug/tools/md5sum.efi     ${arch}/Md5Sum.efi
binary  build/${arch}-debug/tools/sha256sum.efi  ${arch}/Sha256Sum.efi
binary  build/${arch}-debug/tools/fwtool.efi     ${arch}/FwTool.efi
binary  build/${arch}-debug/tools/ata.efi        ${arch}/Ata.efi
binary  build/${arch}-debug/tools/nvme.efi       ${arch}/Nvme.efi
binary  build/${arch}-debug/tools/scsi.efi       ${arch}/Scsi.efi
binary  build/${arch}-debug/tools/smart.efi      ${arch}/Smart.efi
binary  build/${arch}-debug/tools/axbench.efi    ${arch}/Axbench.efi
binary  build/${arch}-debug/tools/kbtune.efi     ${arch}/KbTune.efi
binary  build/${arch}-debug/tools/fbcon.efi      ${arch}/FbCon.efi
binary  build/${arch}-debug/tools/netload.efi    ${arch}/NetLoad.efi
binary  build/${arch}-debug/tools/agent.efi      ${arch}/Agent.efi

# 9p keeps its lowercase source name on the image, unlike every other
# tool here: the protocol is universally written "9P"/"9p" and a name
# starting with a digit has no natural CamelCase form. The leading digit
# is safe end to end -- the orchestrator derives the alias by a plain
# string split (build.sh stage_startup) and the UEFI Shell both accepts
# `alias -v 9p %arch%\9p.efi` and dispatches `9p ls ...` through it
# (verified under OVMF Shell 2.2). Built by `scripts/axl-build.sh tools` via
# its own target; it is not in TOOL_NAMES because it links two embedded DXE
# driver blobs, which the busybox multiplexer cannot express.
binary  build/${arch}-debug/tools/9p.efi         ${arch}/9p.efi

# sshd: a launcher with its resident driver embedded (the 9p shape), so it is
# not in TOOL_NAMES either; built by `scripts/axl-build.sh tools` via its own
# target.
binary  build/${arch}-debug/tools/sshd.efi       ${arch}/Sshd.efi

# sshd-rtk: sshd with Realtek's USB NIC driver embedded, for a machine whose
# only usable NIC is a USB Realtek dongle and no drivers folder is at hand.
# Built only when the consumer hands `scripts/axl-build.sh sshd-rtk` the driver
# binary (RTK_USB_UNDI=<dir>/<arch>/RtkUsbUndiDxe.efi); a build without it
# stages nothing here and the orchestrator warns.
binary  build/${arch}-debug-rtk/tools/sshd-rtk.efi   ${arch}/SshdRtk.efi

# SftpServer: sshd's SFTP helper (OpenSSH's sftp-server split). Sshd loads it
# from beside itself as it starts, so it is staged in the same directory. It is
# a driver loaded by Sshd, not a tool to run. Built by `scripts/axl-build.sh
# tools`.
binary  build/${arch}-debug/tools/SftpServer.efi ${arch}/SftpServer.efi

# sshd-full: sshd with SftpServer.efi embedded -- one file for the Shell, sftp
# and scp. Built by `scripts/axl-build.sh tools`.
binary  build/${arch}-debug/tools/sshd-full.efi  ${arch}/SshdFull.efi

# sshd-full-rtk: sshd-full with Realtek's USB NIC driver embedded too. Built
# only when `scripts/axl-build.sh sshd-full-rtk` is handed the driver
# (RTK_USB_UNDI=...), like sshd-rtk; a build without it stages nothing here and
# the orchestrator warns.
binary  build/${arch}-debug-rtk/tools/sshd-full-rtk.efi ${arch}/SshdFullRtk.efi

# CrashHandler DXE driver + its CrashTest exerciser. The driver is built
# to build/<arch>-debug/drivers/ (subsystem 11); crashtest is a normal app
# in tools/. `driver` stages identically to `binary` — the keyword just
# documents intent. Both produced by `scripts/axl-build.sh ARCH=<arch> tools`.
driver  build/${arch}-debug/drivers/crashhandler.efi  ${arch}/CrashHandler.efi
binary  build/${arch}-debug/tools/crashtest.efi        ${arch}/CrashTest.efi

# Host-side helper. Decodes a CrashDump<N> NVRAM blob (or crash-report.txt)
# against <axl/axl-crashrecord.h> + DWARF; stages to the image's /scripts/.
script  scripts/rsod-decode.py                        scripts/rsod-decode.py

# JSON5 data sidecars. Tools auto-discover these next to the .efi
# (lspci -> pci-ids.json5 vendors[] + classes[]; lsusb ->
# usb-ids.json5; memspd -> jedec.json5). Sidecars are arch-
# independent but copied into each arch dir so the "next to .efi"
# lookup works without requiring users to know the search path.
data    stage/share/axl/pci-ids.json5     ${arch}/pci-ids.json5
data    stage/share/axl/usb-ids.json5     ${arch}/usb-ids.json5
data    stage/share/axl/jedec.json5       ${arch}/jedec.json5
