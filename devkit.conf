# axl-sdk devkit manifest
#
# Declares the shell tools that axl-sdk contributes to the uefi-devkit
# image. Read by uefi-devkit's orchestrator for artifact staging and
# startup.nsh tool-list / alias generation.
#
# axl-sdk's build is special-cased in uefi-devkit (invoked as
# `make -C $AXL_DIR tools ARCH=<arch>`) so this file has no `build:`
# field — the orchestrator drives the build directly. This manifest
# only declares what axl-sdk *produces* and how it should be named on
# the image.

# Tool descriptions (used by startup.nsh "Available tools" listing +
# %arch%\<name>.efi alias generation)
desc: SysInfo        System inventory (CPU, memory, firmware)
desc: NetInfo        Network diagnostics and ping
desc: Grep           Text pattern search in files
desc: Find           File and directory finder
desc: Hexdump        Hex/ASCII file viewer
desc: Cat            Concatenate and display files
desc: Tar            Create/list/extract ustar archives (gzip)
desc: Fetch          HTTP GET/POST client
desc: Clip           Copy stdin to the clipboard (pbcopy)
desc: Paste          Print the clipboard to stdout (pbpaste)
desc: MkRd           Create/list/destroy RAM disks
desc: Ipmi           AXL port of the ipmitool CLI
desc: RfBrowse       Redfish browser
desc: Dmidecode      SMBIOS / DMI table decoder
desc: LsPci          PCI/PCIe device lister
desc: LsUsb          USB device lister
desc: MemSpd         Read JEDEC SPD from DDR4/DDR5 DIMMs over SMBus
desc: I2c            I2C/SMBus explorer (detect/get/set/dump)
desc: MkFixture      Capture hardware fixture for replay/emulation
desc: RndisFix       Send RNDIS_SET_MSG packet filter to RNDIS USB-NICs (workaround for EDK2 UsbRndis stub)
desc: TimeTest       Verify the monotonic microsecond timer
desc: Sed            Stream editor — POSIX sed(1) plus common GNU extensions
desc: FwTool         UEFI firmware image inspector (list/extract/find over .fd)
desc: Ata            List ATA/SATA devices with identity + SMART health
desc: Nvme           List NVMe controllers + namespaces with identity + SMART
desc: Scsi           List SCSI/SAS LUs with identity, capacity, health
desc: Smart          Unified storage inventory + health (smartctl --scan -H)
desc: Axbench        AP-pool (AxlTaskPool) vs BSP benchmark across 8 scenarios
desc: KbTune         Keyboard debounce tuner for KVM key-bounce (GOP UI)
desc: FbCon          Framebuffer console take-over — renders the boot Shell on the GOP (Ctrl+\ exits)
desc: CrashHandler   DXE driver — captures CPU exceptions to NVRAM
desc: CrashTest      Deliberately trigger exceptions to test CrashHandler

# Artifact paths. axl-sdk writes to out/native-<arch>/tools/.
# ${arch} expands to x64 / aa64 per ARCH.
binary  out/native-${arch}/tools/sysinfo.efi    ${arch}/SysInfo.efi
binary  out/native-${arch}/tools/netinfo.efi    ${arch}/NetInfo.efi
binary  out/native-${arch}/tools/grep.efi       ${arch}/Grep.efi
binary  out/native-${arch}/tools/find.efi       ${arch}/Find.efi
binary  out/native-${arch}/tools/hexdump.efi    ${arch}/Hexdump.efi
binary  out/native-${arch}/tools/cat.efi        ${arch}/Cat.efi
binary  out/native-${arch}/tools/tar.efi        ${arch}/Tar.efi
binary  out/native-${arch}/tools/fetch.efi      ${arch}/Fetch.efi
binary  out/native-${arch}/tools/clip.efi       ${arch}/Clip.efi
binary  out/native-${arch}/tools/paste.efi      ${arch}/Paste.efi
binary  out/native-${arch}/tools/mkrd.efi       ${arch}/MkRd.efi
binary  out/native-${arch}/tools/ipmi.efi       ${arch}/Ipmi.efi
binary  out/native-${arch}/tools/rfbrowse.efi   ${arch}/RfBrowse.efi
binary  out/native-${arch}/tools/dmidecode.efi  ${arch}/Dmidecode.efi
binary  out/native-${arch}/tools/lspci.efi      ${arch}/LsPci.efi
binary  out/native-${arch}/tools/lsusb.efi      ${arch}/LsUsb.efi
binary  out/native-${arch}/tools/memspd.efi     ${arch}/MemSpd.efi
binary  out/native-${arch}/tools/i2c.efi        ${arch}/I2c.efi
binary  out/native-${arch}/tools/mkfixture.efi  ${arch}/MkFixture.efi
binary  out/native-${arch}/tools/rndisfix.efi   ${arch}/RndisFix.efi
binary  out/native-${arch}/tools/timetest.efi   ${arch}/TimeTest.efi
binary  out/native-${arch}/tools/sed.efi        ${arch}/Sed.efi
binary  out/native-${arch}/tools/fwtool.efi     ${arch}/FwTool.efi
binary  out/native-${arch}/tools/ata.efi        ${arch}/Ata.efi
binary  out/native-${arch}/tools/nvme.efi       ${arch}/Nvme.efi
binary  out/native-${arch}/tools/scsi.efi       ${arch}/Scsi.efi
binary  out/native-${arch}/tools/smart.efi      ${arch}/Smart.efi
binary  out/native-${arch}/tools/axbench.efi    ${arch}/Axbench.efi
binary  out/native-${arch}/tools/kbtune.efi     ${arch}/KbTune.efi
binary  out/native-${arch}/tools/fbcon.efi      ${arch}/FbCon.efi

# CrashHandler DXE driver + its CrashTest exerciser. The driver is built
# to out/native-<arch>/drivers/ (subsystem 11); crashtest is a normal app
# in tools/. `driver` stages identically to `binary` — the keyword just
# documents intent. Both produced by `make tools`.
driver  out/native-${arch}/drivers/crashhandler.efi  ${arch}/CrashHandler.efi
binary  out/native-${arch}/tools/crashtest.efi        ${arch}/CrashTest.efi

# Host-side helper. Decodes a CrashDump<N> NVRAM blob (or crash-report.txt)
# against <axl/axl-crashrecord.h> + DWARF; stages to the image's /scripts/.
script  scripts/rsod-decode.py                        scripts/rsod-decode.py

# JSON5 data sidecars. Tools auto-discover these next to the .efi
# (lspci -> pci-ids.json5 vendors[] + classes[]; lsusb ->
# usb-ids.json5; memspd -> jedec.json5). Sidecars are arch-
# independent but copied into each arch dir so the "next to .efi"
# lookup works without requiring users to know the search path.
data    out/share/axl/pci-ids.json5     ${arch}/pci-ids.json5
data    out/share/axl/usb-ids.json5     ${arch}/usb-ids.json5
data    out/share/axl/jedec.json5       ${arch}/jedec.json5
